<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>KGI Pipe AR</title>
<style>
  :root { --bg: #14171b; --panel: rgba(20, 23, 27, 0.82); --text: #eef0f2; --muted: #a9b1bb; --accent: #4a9bea; --ok: #3fbf6f; --warn: #f0b429; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; overflow: hidden; }
  #overlay { position: fixed; inset: 0; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; }
  #overlay.on { display: flex; }
  .bar { pointer-events: auto; background: var(--panel); padding: 12px 16px; }
  #title { font-weight: 600; font-size: 15px; }
  #msg { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.45; }
  #msg b { color: var(--text); }
  #status { margin-top: 6px; font-size: 13px; }
  #status:empty, #err:empty { display: none; }
  #err { margin-top: 6px; font-size: 13px; color: #ff7a7a; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 8px; border: 1px solid #3a414a; background: #222830; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  button[hidden] { display: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 440px; background: #1d2127; border: 1px solid #2e343c; border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
  .card h1 { margin: 0; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .modes { display: grid; gap: 8px; }
  .modes label { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid #2e343c; border-radius: 8px; cursor: pointer; }
  .modes label:has(input:checked) { border-color: var(--accent); }
  .modes small { display: block; color: var(--muted); margin-top: 2px; }
  #support { font-size: 13px; }
  a { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="start">
  <div class="card">
    <h1 id="line-name">불러오는 중…</h1>
    <div class="modes">
      <label><input type="radio" name="mode" value="site" checked>
        <span><b>현장 정합 (1:1)</b><small>도면의 기준점 2곳을 실제 바닥에서 찍으면, 배관이 실제 크기로 그 자리에 놓입니다.</small></span></label>
      <label><input type="radio" name="mode" value="mini">
        <span><b>축소 모형</b><small>책상·바닥에 두 점을 찍으면, 그 길이에 맞춰 축소된 모형이 놓입니다.</small></span></label>
    </div>
    <p id="support">AR 지원 여부 확인 중…</p>
    <div class="btns">
      <button class="primary" id="btn-ar" disabled>AR 시작</button>
      <button id="btn-sim">PC 시뮬레이션</button>
    </div>
    <p><a href="index.html">← 모델 목록으로</a></p>
  </div>
</div>

<div id="overlay">
  <div class="bar"><div id="title"></div><div id="msg"></div><div id="status"></div><div id="err"></div></div>
  <div class="bar btns" id="controls">
    <button class="primary" id="btn-mark">점 찍기</button>
    <button id="btn-height" hidden>바닥으로 내리기</button>
    <button id="btn-reset">다시 지정</button>
    <button id="btn-exit">종료</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const lineId = new URLSearchParams(location.search).get('line') || 'PA-00011';
const UP = new THREE.Vector3(0, 1, 0);

// ---------- data ----------
const line = await fetch(`models/${lineId}.json`).then(r => r.json());   // generated metadata (refPoints etc.)
// [E, N, EL] mm -> three.js meters (x = E, y = EL, z = -N)
const toV = a => new THREE.Vector3(a[0] / 1000, a[2] / 1000, -a[1] / 1000);
const refs = line.refPoints.map(p => ({ label: p.label, v: toV(p.at) }));
$('line-name').textContent = line.name;
$('title').textContent = line.name;

const gltf = await new GLTFLoader().loadAsync(`models/${lineId}.glb`);
const model = gltf.scene;
const box = new THREE.Box3().setFromObject(model);
const refMarks = new THREE.Group(); // model reference points, compared against the taps in site mode
for (const r of refs) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0x3fbf6f }));
  s.position.copy(r.v); refMarks.add(s);
}
model.add(refMarks);
const pivot = new THREE.Group(); pivot.add(model); pivot.visible = false;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.add(pivot);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 10, 4); scene.add(sun);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 200);
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

const reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.1, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
reticle.visible = false; scene.add(reticle);
const markers = new THREE.Group(); scene.add(markers);

// ---------- placement logic ----------
let mode = 'site', taps = [], lowered = false, hit = null;
const angleXZ = v => Math.atan2(-v.z, v.x);   // rotation about +Y moves this angle by +theta

function msg(html) { $('msg').innerHTML = html; }
function status(text) { $('status').textContent = text; }
function showError(e) { console.error(e); $('err').textContent = '오류: ' + (e && e.message || e); }
addEventListener('error', e => showError(e.error || e.message));
addEventListener('unhandledrejection', e => showError(e.reason));

function prompt() {
  if (taps.length >= 2) return;
  const n = taps.length + 1;
  msg(mode === 'site'
    ? `<b>${n}번 점</b>: 「${refs[taps.length].label}」 위치를 비추고 <b>점 찍기</b>`
    : `<b>${n}번 점</b>: 모형을 놓을 길이의 ${n === 1 ? '시작' : '끝'}점을 비추고 <b>점 찍기</b>`);
}

function mark() {
  if (taps.length >= 2) return;
  if (!hit) { msg('바닥(또는 책상)을 천천히 비춰 흰 원이 나타나게 해 주세요.'); return; }
  const p = hit.clone(); taps.push(p);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 12), new THREE.MeshBasicMaterial({ color: taps.length === 1 ? 0xff5a5a : 0x5a9bff }));
  m.position.copy(p).add(new THREE.Vector3(0, 0.15, 0)); markers.add(m);
  if (taps.length === 2) place(); else prompt();
}

function place() {
  const [A, B] = taps;
  const d = B.clone().sub(A); d.y = 0;
  const realDist = d.length();
  if (realDist < 0.05) { reset(); msg('두 점이 너무 가깝습니다. 다시 찍어 주세요.'); return; }
  if (mode === 'site') {
    const mA = refs[0].v, mB = refs[1].v;
    const md = mB.clone().sub(mA); md.y = 0;
    const theta = angleXZ(d) - angleXZ(md);
    const midM = mA.clone().add(mB).multiplyScalar(0.5);
    const midR = A.clone().add(B).multiplyScalar(0.5);
    pivot.scale.setScalar(1);
    pivot.rotation.set(0, theta, 0);
    pivot.position.copy(midR).sub(midM.clone().applyAxisAngle(UP, theta));
    pivot.position.y = (A.y + B.y) / 2 + (lowered ? -box.min.y : 0);
    const err = (realDist - md.length()) * 100;
    const ok = Math.abs(err) <= 10;
    msg(`배치 완료. 도면 기준 거리 <b>${md.length().toFixed(2)} m</b>, 실제 찍은 거리 <b>${realDist.toFixed(2)} m</b> → ` +
        `<b style="color:var(${ok ? '--ok' : '--warn'})">오차 ${err >= 0 ? '+' : ''}${err.toFixed(0)} cm</b>` +
        (ok ? '' : '<br>오차가 큽니다. 기준점을 정확히 찍었는지 확인하고 <b>다시 지정</b>하세요.'));
    $('btn-height').hidden = false;
  } else {
    const sizeX = box.max.x - box.min.x, sizeZ = box.max.z - box.min.z;
    const longAxis = sizeX >= sizeZ ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, -1);
    const s = realDist / Math.max(sizeX, sizeZ);
    const theta = angleXZ(d) - angleXZ(longAxis);
    const c = box.getCenter(new THREE.Vector3()); c.y = 0;
    const midR = A.clone().add(B).multiplyScalar(0.5);
    pivot.scale.setScalar(s);
    pivot.rotation.set(0, theta, 0);
    pivot.position.copy(midR).sub(c.applyAxisAngle(UP, theta).multiplyScalar(s));
    pivot.position.y = (A.y + B.y) / 2 - box.min.y * s;
    msg(`축소 모형 배치 완료 (축척 약 <b>1:${Math.round(1 / s)}</b>).`);
  }
  refMarks.visible = mode === 'site' && !lowered;
  pivot.visible = true; reticle.visible = false;
  $('btn-mark').hidden = true;
}

function reset() {
  taps = []; markers.clear(); pivot.visible = false;
  $('btn-mark').hidden = false; $('btn-height').hidden = true;
  prompt();
}

$('btn-mark').addEventListener('click', mark);
$('btn-reset').addEventListener('click', reset);
$('btn-height').addEventListener('click', () => {
  lowered = !lowered;
  $('btn-height').textContent = lowered ? '실제 높이로' : '바닥으로 내리기';
  if (taps.length === 2) place();
});
// Buttons inside the AR DOM overlay must not also count as a screen tap.
$('controls').addEventListener('beforexrselect', e => e.preventDefault());

function begin() {
  mode = document.querySelector('input[name=mode]:checked').value;
  $('start').style.display = 'none'; $('overlay').classList.add('on');
  reset();
}

// ---------- WebXR (Android Chrome) ----------
let hitSource = null;
async function startAR() {
  // The overlay root should be displayed when the session asks for it, or Chrome may not show it.
  $('overlay').classList.add('on');
  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: $('overlay') } });
  } catch (e) { $('overlay').classList.remove('on'); throw e; }
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  const viewer = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewer });
  session.addEventListener('select', () => { try { mark(); } catch (e) { showError(e); } });
  session.addEventListener('end', () => location.reload());
  begin();
  reticle.matrixAutoUpdate = false;
  let lastHitAt = 0, floorShown = null;
  // three.js re-requests the next XR frame only after this callback returns, so an exception here
  // would freeze hit-testing for the rest of the session. Never let it throw.
  renderer.setAnimationLoop((t, frame) => {
    try {
      reticle.visible = false;
      if (frame && hitSource && taps.length < 2) {
        const res = frame.getHitTestResults(hitSource);
        const pose = res.length ? res[0].getPose(renderer.xr.getReferenceSpace()) : null;  // getPose may return null
        if (pose) {
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
          hit = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
          lastHitAt = t;
        } else if (t - lastHitAt > 700) {
          hit = null;   // keep the last hit briefly so a tap during a one-frame dropout still counts
        }
        const found = !!hit;
        if (found !== floorShown) { floorShown = found; status(found ? '✅ 바닥 인식됨 — 흰 원 위치에 점을 찍을 수 있습니다' : '🔍 바닥 찾는 중… 휴대폰을 천천히 좌우로 움직여 주세요'); }
      } else if (floorShown !== null && taps.length >= 2) { floorShown = null; status(''); }
    } catch (e) { showError(e); }
    renderer.render(scene, camera);
  });
}
$('btn-exit').addEventListener('click', () => renderer.xr.getSession() ? renderer.xr.getSession().end() : location.reload());

// ---------- PC simulation: click on a virtual floor instead of a camera hit-test ----------
function startSim() {
  scene.background = new THREE.Color(0x1b1f24);
  scene.add(new THREE.GridHelper(40, 40, 0x556070, 0x30363e));
  camera.position.set(4, 7, 14);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(4, 2, 0); controls.update();
  const floor = new THREE.Plane(UP, 0), ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  const toHit = e => {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.ray.intersectPlane(floor, new THREE.Vector3());
  };
  renderer.domElement.addEventListener('pointermove', e => {
    hit = taps.length < 2 ? toHit(e) : null;
    reticle.visible = !!hit; if (hit) reticle.position.copy(hit);
  });
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) { hit = toHit(e); mark(); }
  });
  begin();
  msg($('msg').innerHTML + '<br><small>PC 시뮬레이션: 바닥 격자를 클릭하면 점이 찍힙니다. 드래그로 시점 회전.</small>');
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}
$('btn-sim').addEventListener('click', startSim);
// debug hook for automated checks
window.__ar = { get taps() { return taps; }, pivot, refs, box, place, setTaps: (a, b) => { taps = [a, b]; place(); } , THREE };

// ---------- capability check ----------
const arOK = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
$('btn-ar').disabled = !arOK;
$('support').textContent = arOK
  ? '이 기기에서 AR을 사용할 수 있습니다.'
  : '이 기기/브라우저는 웹 AR(WebXR)을 지원하지 않습니다. 안드로이드 Chrome에서 HTTPS 주소로 열어 주세요. (아이폰은 아직 미지원)';
$('btn-ar').addEventListener('click', () => startAR().catch(e => { $('support').textContent = 'AR 시작 실패: ' + e.message; }));
</script>
</body>
</html>
